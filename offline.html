<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#173f34" />
  <title>TIME2INCOME — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f5f7f2; color: #182720; font: 16px/1.6 'DM Sans', sans-serif; }
    main { width: min(100%, 480px); padding: 28px; border: 1px solid #dce4dc; border-radius: 8px; background: #fff; }
    img { width: 48px; height: 48px; }
    h1 { margin: 18px 0 8px; font: 800 28px/1.15 'Manrope', sans-serif; }
    p { color: #66756d; }
    a, button { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; margin-top: 8px; padding: 10px 14px; border: 0; border-radius: 5px; background: #17694f; color: #fff; font: 700 13px 'DM Sans', sans-serif; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/time2income-mark.png" alt="T2I — TIME2INCOME" />
    <h1>You are offline</h1>
    <p>Reconnect to the internet to browse providers, sign in, post tasks or manage bookings. Account and marketplace data are never stored for offline use.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
